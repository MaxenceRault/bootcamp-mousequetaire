# PR vers main → vérifications avant merge (le déploiement reste dans deploy.yml, après merge).
# Aucun accès GCP : le code d'une PR n'est pas encore relu.
name: CI

on:
  pull_request:
    branches: [main]

# Un nouveau push sur la PR annule le run en cours.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Épinglées par SHA : un tag peut être déplacé vers du code malveillant.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Inclut les règles du projet : couches, i18n, z.strictObject, getConfig(), console.
      - name: Lint
        run: npm run lint

      # Types des routes (PageProps, LayoutProps) générés par Next avant le typecheck.
      - name: Typecheck
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Audit des dépendances (zéro critique)
        run: npm audit --omit=dev --audit-level=critical

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build de production
        run: npm run build
