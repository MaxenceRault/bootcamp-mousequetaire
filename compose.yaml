# Dev conteneurisé : podman compose up (ou docker compose up) → http://localhost:3000.
# Prérequis : gcloud auth application-default login ; variables dans .env.local.
services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: true
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
      # Les notifications de fichiers ne traversent pas le montage : polling (recompilation et nouvelles routes).
      WATCH_POLL_INTERVAL_MS: "1000"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      # Binaires Linux du conteneur, jamais mélangés avec ceux de la machine.
      - node_modules:/app/node_modules
      - next:/app/.next
      # Windows : GCLOUD_CONFIG_DIR=%APPDATA%\gcloud.
      - ${GCLOUD_CONFIG_DIR:-${HOME}/.config/gcloud}:/gcloud:ro

volumes:
  node_modules:
  next:
