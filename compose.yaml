# Environnement de développement conteneurisé : même version de Node et mêmes outils pour toute l'équipe,
# quelle que soit la machine. Démarrage : docker compose up (puis http://localhost:3000).
#
# Prérequis sur la machine : Docker, et gcloud pour l'identité GCP (une seule fois :
# gcloud auth application-default login). Le conteneur réutilise ces identifiants en lecture seule :
# aucune clé ni mot de passe dans le repo. Variables de l'app : .env.local (voir .env.example).
services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: true
    environment:
      # Identifiants Google de la machine (ADC), montés ci-dessous.
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
      # Rechargement à chaud : les modifications du code monté sont détectées par polling (next.config.ts).
      WATCH_POLL_INTERVAL_MS: "1000"
    volumes:
      # Code source de la machine : modifications prises en compte à chaud.
      - .:/app
      # Dépendances et build propres au conteneur (binaires Linux), jamais mélangés avec ceux de la machine.
      - node_modules:/app/node_modules
      - next:/app/.next
      # Dossier de configuration gcloud : ~/.config/gcloud (macOS, Linux) ; sous Windows, définir
      # GCLOUD_CONFIG_DIR=%APPDATA%\gcloud avant docker compose up.
      - ${GCLOUD_CONFIG_DIR:-${HOME}/.config/gcloud}:/gcloud:ro

volumes:
  node_modules:
  next:
